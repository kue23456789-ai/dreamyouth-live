<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1226C9" />
  <title>DREAM YOUTH · 오늘의 예배</title>
  <meta name="description" content="드림유스 주일예배 실시간 안내 — 예배 순서, 찬양 리스트, 공지사항" />

  <!-- Fonts: Black Han Sans(포스터용) + Pretendard(본문) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet" />
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ① 헤더 / 히어로 -->
  <header class="hero">
    <div class="hero-top">
      <span class="brand">DREAM YOUTH</span>
      <div class="hero-top-right">
        <a class="home-link" href="index.html">← 홈</a>
        <span class="live-badge" id="liveBadge"><span class="dot"></span>LIVE</span>
      </div>
    </div>

    <p class="hero-date" id="todayDate">—</p>
    <h1 class="hero-title" id="worshipTitle">오늘의 예배</h1>

    <div class="hero-message">
      <p class="message-label">오늘의 한 문장</p>
      <p class="message-text" id="worshipMessage">…</p>
      <p class="message-meta"><span id="worshipVerse"></span> · <span id="worshipPreacher"></span></p>
    </div>

    <a class="hero-yt-btn" href="https://youtube.com/@dream_youth" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
        <rect x="2" y="5" width="20" height="14" rx="5" stroke="currentColor" stroke-width="1.8" />
        <path d="M10.3 9.4L15 12L10.3 14.6V9.4Z" fill="currentColor" />
      </svg>
      유튜브로 함께 예배해요
    </a>
  </header>

  <main>
    <!-- ② 예배 콘티 -->
    <section class="section" id="orderSection" aria-labelledby="orderHeading">
      <div class="section-head">
        <h2 id="orderHeading">예배 순서</h2>
        <p class="section-sub">지금 어디까지 왔는지 여기서 확인하세요</p>
      </div>
      <ol class="order-list" id="orderList"></ol>
    </section>

    <!-- ③ Song List (포스터) -->
    <section class="section" aria-labelledby="songHeading">
      <div class="poster" id="songPoster">
        <div class="poster-head">
          <span class="poster-eyebrow">TODAY'S SET</span>
          <h2 id="songHeading" class="poster-title">SONG<br />LIST</h2>
        </div>
        <ol class="track-list" id="songList"></ol>
        <p class="poster-foot">함께 크게 부르자 · DREAM YOUTH PRAISE</p>
      </div>
    </section>

    <!-- ④ 공지사항 -->
    <section class="section" aria-labelledby="noticeHeading">
      <div class="section-head">
        <h2 id="noticeHeading">공지사항</h2>
        <p class="section-sub">예배 후 꼭 확인해요</p>
      </div>
      <div class="notice-grid" id="noticeGrid"></div>
    </section>

    <!-- ⑤ 섬김 명단 -->
    <section class="section" aria-labelledby="servantHeading">
      <div class="section-head">
        <h2 id="servantHeading">함께 섬기는 사람들</h2>
        <p class="section-sub">날짜를 눌러 다음 주 명단도 볼 수 있어요</p>
      </div>
      <div class="servant-tabs" id="servantTabs" role="tablist"></div>
      <div class="servant-card">
        <table class="servant-table">
          <tbody id="servantBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="foot">
    <p>DREAM YOUTH · 드림유스</p>
    <p class="foot-sub" id="updatedAt"></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
